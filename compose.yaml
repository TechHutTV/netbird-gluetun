name: netbird-gluetun
services:
  netns:
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: netns
    entrypoint: ["/bin/sleep", "infinity"]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
    restart: unless-stopped
  gluetun:
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: gluetun-vpn
    network_mode: service:netns
    depends_on:
      netns:
        condition: service_started
    entrypoint: ["/bin/sh", "/iptables/vpn-init.sh"]
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER}
      VPN_TYPE: ${VPN_TYPE}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
      WIREGUARD_PRESHARED_KEY: ${WIREGUARD_PRESHARED_KEY}
      WIREGUARD_MTU: "1400"
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES}
      SERVER_CITIES: ${SERVER_CITIES}
      FIREWALL_VPN_INPUT_PORTS: ${FIREWALL_VPN_INPUT_PORTS}
      HEALTH_VPN_DURATION_INITIAL: ${HEALTH_VPN_DURATION_INITIAL:-30s}
      TZ: ${TZ:-UTC}
    volumes:
      - ./gluetun:/gluetun
      - ./post-rules.txt:/iptables/post-rules.txt:ro
      - ./vpn-init.sh:/iptables/vpn-init.sh:ro
    restart: unless-stopped
  netbird:
    image: netbirdio/netbird:0.79.0@sha256:9d8480d87b7f7c10d67b820eecf332ecca5c2756792d4bdfa532182b4fc3005f
    container_name: netbird-exit
    network_mode: service:netns
    cap_add: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
    devices: [/dev/net/tun:/dev/net/tun]
    environment:
      NB_SETUP_KEY: ${NETBIRD_EXIT_SETUP_KEY}
      NB_DISABLE_IPV6: "true"
      NB_DISABLE_DNS: "true"
      NB_MANAGEMENT_URL: ${NETBIRD_MANAGMENT_URL}
      NB_HOSTNAME: lab-gluetun-exit
      NB_WIREGUARD_PORT: ${FIREWALL_VPN_INPUT_PORTS}
      NB_BLOCK_LAN_ACCESS: "true"
    volumes: [netbird-exit:/var/lib/netbird]
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    restart: unless-stopped
volumes:
  netbird-exit:
